<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0F6E56" />
    <title>ExperiPhoto</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header class="bar">
      <h1>ExperiPhoto</h1>
      <span id="demo-badge" class="badge" hidden>お試し</span>
      <span class="spacer"></span>
      <button id="btn-refresh" class="icon" title="プロジェクトの一覧を読み直す" aria-label="読み直す">↻</button>
      <button id="btn-settings" class="icon" title="設定" aria-label="設定">⚙</button>
    </header>

    <main>
      <!-- つなぐ前 -->
      <section id="view-connect" hidden>
        <p class="lead">実験中に撮った写真を、Dropbox を通して Mac の Research Hub に送ります。</p>
        <p class="muted small">Dropbox には、このアプリ専用のフォルダー（アプリ/ExperiPhoto…）だけを使う許可を出します。ほかのファイルは読み書きしません。</p>
        <button id="btn-connect" class="primary big">Dropbox につなぐ</button>
        <p id="connect-note" class="muted small"></p>
      </section>

      <!-- 撮る -->
      <section id="view-main" hidden>
        <div class="field">
          <div class="label">プロジェクト</div>
          <div id="projects" class="chips"></div>
          <p id="projects-note" class="muted small"></p>
        </div>

        <div class="field">
          <label class="label" for="experiment">実験ノート（選ばなくてもよい）</label>
          <select id="experiment"></select>
        </div>

        <div class="field">
          <label class="label" for="memo">メモ（写真の名前に入ります）</label>
          <div class="memo-row">
            <input id="memo" type="text" enterkeyhint="done" autocomplete="off" placeholder="例：WBサンプル、PCR条件" maxlength="40" />
            <button id="btn-memo-clear" class="icon" aria-label="メモを消す" title="メモを消す">×</button>
          </div>
          <div id="memo-recent" class="chips small"></div>
        </div>

        <label class="shoot primary">
          <input id="in-camera" type="file" accept="image/*" capture="environment" hidden />
          <span class="shoot-icon">📷</span>
          <span>撮る</span>
          <span id="shoot-target" class="shoot-target"></span>
        </label>
        <label class="pick">
          <input id="in-library" type="file" accept="image/*" multiple hidden />
          🖼 撮ってある写真から選ぶ
        </label>

        <div class="sent-head">
          <h2>送った写真 <span class="muted small">直近 30 枚</span></h2>
          <span id="queue-state" class="muted small"></span>
        </div>
        <ul id="sent" class="sent"></ul>
        <p id="sent-empty" class="muted small">まだありません。</p>
      </section>
    </main>

    <dialog id="settings">
      <form method="dialog">
        <h2>設定</h2>
        <label class="check">
          <input id="opt-shrink" type="checkbox" />
          <span>縮小して送る（長い辺を 2048px に。通信量を減らしたいとき）</span>
        </label>
        <p class="muted small">ふだんは原寸のまま送ります。ブロットやゲルの細部を残すためです。</p>
        <label class="check">
          <input id="opt-review" type="checkbox" />
          <span>撮ったあとに確かめる（切り取り・回転・撮り直し）</span>
        </label>
        <p class="muted small">切り取りも回転もしなければ、撮った写真をそのまま送ります。</p>
        <hr />
        <p id="account" class="small"></p>
        <button id="btn-disconnect" type="button">Dropbox との接続を外す</button>
        <button id="btn-clear-log" type="button">「送った写真」の一覧を消す（写真は消えません）</button>
        <hr />
        <p class="muted small" id="version"></p>
        <button value="close" class="primary">閉じる</button>
      </form>
    </dialog>

    <!-- 撮ったあとの確認：切り取り・回転・撮り直し -->
    <dialog id="review" class="review">
      <div class="review-head">
        <span id="rv-count"></span>
        <span id="rv-target" class="ellipsis"></span>
      </div>
      <div id="rv-stage" class="review-stage">
        <div id="rv-frame" class="review-frame">
          <canvas id="rv-canvas"></canvas>
          <div id="rv-crop" class="crop">
            <i data-h="nw"></i><i data-h="n"></i><i data-h="ne"></i><i data-h="e"></i>
            <i data-h="se"></i><i data-h="s"></i><i data-h="sw"></i><i data-h="w"></i>
          </div>
        </div>
      </div>
      <p class="review-hint">白い丸を動かすと切り取れます。枠の中をなぞると枠ごと動きます。</p>
      <div class="review-tools">
        <button id="rv-rotate" type="button">⟳ 右に 90°</button>
        <button id="rv-reset" type="button">元に戻す</button>
      </div>
      <div class="review-actions">
        <button id="rv-retake" type="button">撮り直す</button>
        <button id="rv-skip" type="button">送らない</button>
        <button id="rv-send" type="button" class="primary">送る</button>
      </div>
      <button id="rv-rest" type="button" class="review-rest"></button>
    </dialog>

    <div id="toast" class="toast" hidden></div>
  </body>
</html>
